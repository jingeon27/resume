  <rect x="80" y="180" width="340" height="75" rx="14" fill="#edf4ff" stroke="none" stroke-width="1.5"/><text x="250" y="229" font-size="28" font-weight="700" fill="#182230" text-anchor="middle">브라우저</text><rect x="550" y="180" width="340" height="75" rx="14" fill="#edf4ff" stroke="none" stroke-width="1.5"/><text x="720" y="229" font-size="28" font-weight="700" fill="#182230" text-anchor="middle">NestJS API</text><rect x="1020" y="180" width="340" height="75" rx="14" fill="#fff2e6" stroke="none" stroke-width="1.5"/><text x="1190" y="229" font-size="28" font-weight="700" fill="#182230" text-anchor="middle">S3</text><path d="M250 270 V720" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 7"/><path d="M720 270 V720" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 7"/><path d="M1190 270 V720" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 7"/><path d="M250 315 L708 315" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="297" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">업로드 주소 발급 요청</text><path d="M720 385 L262 385" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="367" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">크기와 형식이 정해진 presigned POST</text><path d="M250 467 L1178 467" fill="none" stroke="#ee7624" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="449" font-size="24" font-weight="600" fill="#ee7624" text-anchor="middle">파일 직접 전송, API 메모리에 전체 파일을 올리지 않음</text><path d="M250 547 L708 547" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="529" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">전송 후 완료 확인 요청</text><path d="M720 617 L1178 617" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="958" y="594" font-size="22" font-weight="400" fill="#182230" text-anchor="middle">HEAD, 앞 4KB 검사, ETag 조건부 복사</text><path d="M720 687 L262 687" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="669" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">확정한 객체 ID 반환</text><rect x="80" y="764" width="1280" height="150" rx="16" fill="#f5f7fa" stroke="none" stroke-width="1.5"/><text x="108" y="811" font-size="26" font-weight="700" fill="#182230" text-anchor="start">서버에 남는 작업</text><text x="108" y="849" font-size="21" font-weight="400" fill="#5e6b7c" text-anchor="start">프로필 변환과 기존 multipart</text><text x="108" y="880" font-size="21" font-weight="400" fill="#5e6b7c" text-anchor="start">본문 수신 전에 슬롯 확보</text><text x="508" y="803" font-size="23" font-weight="600" fill="#182230" text-anchor="middle">동시 3개</text><rect x="434" y="824" width="44" height="51" rx="8" fill="#edf4ff" stroke="#8db1f8" stroke-width="1.5"/><rect x="487" y="824" width="44" height="51" rx="8" fill="#edf4ff" stroke="#8db1f8" stroke-width="1.5"/><rect x="540" y="824" width="44" height="51" rx="8" fill="#edf4ff" stroke="#8db1f8" stroke-width="1.5"/><text x="826" y="803" font-size="23" font-weight="600" fill="#182230" text-anchor="middle">대기 12개</text><rect x="715" y="821" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="754" y="821" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="793" y="821" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="832" y="821" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="871" y="821" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="910" y="821" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="715" y="854" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="754" y="854" width="31" height="25" rx="5" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><rect x="793" y="8