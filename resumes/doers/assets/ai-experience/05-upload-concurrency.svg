<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-label="파일은 S3로, 확정 처리는 API로">
  <title>파일은 S3로, 확정 처리는 API로</title><desc>서버의 동시 처리 상한을 두던 방식에서 모든 파일의 직접 업로드로 통일했습니다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8797"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif}text{font-variant-numeric:tabular-nums}</style>
  <rect width="1440" height="1010" fill="#f5f7fa"/>
  <rect x="22" y="22" width="1396" height="966" rx="28" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/>
  <text x="76" y="85" font-size="40" font-weight="700" fill="#182230" text-anchor="start">파일은 S3로, 확정 처리는 API로</text>
  <text x="76" y="127" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">서버의 동시 처리 상한을 두던 방식에서 모든 파일의 직접 업로드로 통일했습니다</text>
  <rect x="80" y="180" width="340" height="75" rx="14" fill="#edf4ff" stroke="none" stroke-width="1.5"/><text x="250" y="229" font-size="28" font-weight="700" fill="#182230" text-anchor="middle">브라우저</text><rect x="550" y="180" width="340" height="75" rx="14" fill="#edf4ff" stroke="none" stroke-width="1.5"/><text x="720" y="229" font-size="28" font-weight="700" fill="#182230" text-anchor="middle">NestJS API</text><rect x="1020" y="180" width="340" height="75" rx="14" fill="#fff2e6" stroke="none" stroke-width="1.5"/><text x="1190" y="229" font-size="28" font-weight="700" fill="#182230" text-anchor="middle">S3</text><path d="M250 270 V720" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 7"/><path d="M720 270 V720" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 7"/><path d="M1190 270 V720" stroke="#dce3eb" stroke-width="2" stroke-dasharray="6 7"/><path d="M250 315 L708 315" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="297" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">업로드 주소 발급 요청</text><path d="M720 385 L262 385" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="367" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">크기와 형식이 정해진 presigned POST</text><path d="M250 467 L1178 467" fill="none" stroke="#ee7624" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="449" font-size="24" font-weight="600" fill="#ee7624" text-anchor="middle">파일 직접 전송, API 메모리에 전체 파일을 올리지 않음</text><path d="M250 547 L708 547" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="529" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">전송 후 완료 확인 요청</text><path d="M720 617 L1178 617" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="958" y="594" font-size="22" font-weight="400" fill="#182230" text-anchor="middle">HEAD, 앞 4KB 검사, ETag 조건부 복사</text><path d="M720 687 L262 687" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="669" font-size="23" font-weight="400" fill="#182230" text-anchor="middle">확정한 객체 ID 반환</text><rect x="80" y="764" width="1280" height="150" rx="16" fill="#f5f7fa" stroke="none" stroke-width="1.5"/><text x="108" y="808" font-size="26" font-weight="700" fill="#182230" text-anchor="start">이전: API에서 파일 수신</text><text x="108" y="849" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">동시 3개 처리, 12개 대기</text><text x="108" y="883" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">서버가 받을 수 있는 양을 제한</text><path d="M618 841 L736 841" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="794" y="808" font-size="26" font-weight="700" fill="#ee7624" text-anchor="start">현재: 모든 파일을 S3로 직접 전송</text><text x="794" y="849" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">프로필 사진도 같은 방식으로 통일</text><text x="794" y="883" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">API는 필요한 부분만 검사한 뒤 확정</text>
  <path d="M76 943 H1364" stroke="#dce3eb"/>
  <text x="76" y="973" font-size="18" font-weight="400" fill="#5e6b7c" text-anchor="start">김진건 | AI 활용 경험</text>
</svg>