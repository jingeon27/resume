<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-label="사진 대회에서 상시 그룹으로">
  <title>사진 대회에서 상시 그룹으로</title><desc>그룹의 수명과 게시물 작성을 대회 마감에서 분리했습니다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8797"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif}text{font-variant-numeric:tabular-nums}</style>
  <rect width="1440" height="650" fill="#f5f7fa"/>
  <rect x="22" y="22" width="1396" height="606" rx="28" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/>
  <text x="76" y="85" font-size="40" font-weight="700" fill="#182230" text-anchor="start">사진 대회에서 상시 그룹으로</text>
  <text x="76" y="127" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">그룹의 수명과 게시물 작성을 대회 마감에서 분리했습니다</text>
  <rect x="80" y="190" width="550" height="278" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="235" font-size="28" font-weight="700" fill="#182230" text-anchor="start">처음 구상한 사진 대회</text><text x="108" y="279" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">정해진 접수와 투표 기간</text><text x="108" y="316" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">대회에 사진을 제출</text><text x="108" y="353" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">투표가 끝나면 결과 확인</text><rect x="810" y="190" width="550" height="278" rx="20" fill="#fff2e6" stroke="#dce3eb" stroke-width="1.5"/><text x="838" y="235" font-size="28" font-weight="700" fill="#ee7624" text-anchor="start">변경한 그룹 커뮤니티</text><text x="838" y="279" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">기간 없이 사진과 동영상 게시</text><text x="838" y="316" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">가입 그룹의 글을 홈에서 모아 보기</text><text x="838" y="353" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">공개 탐색과 비공개 가입 승인</text><path d="M654 326 L786 326" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="298" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="middle">방향 변경</text><rect x="80" y="508" width="1280" height="66" rx="14" fill="#edf4ff" stroke="none" stroke-width="1.5"/><text x="110" y="551" font-size="25" font-weight="400" fill="#182230" text-anchor="start">대회는 그룹 안에서 선택해 참여하는 기능으로 유지하고, 이전 사진과 링크는 보존했습니다.</text>
  <path d="M76 583 H1364" stroke="#dce3eb"/>
  <text x="76" y="613" font-size="18" font-weight="400" fill="#5e6b7c" text-anchor="start">김진건 | AI 활용 경험</text>
</svg>