<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-label="수집한 정보를 MCP로 다시 확인">
  <title>수집한 정보를 MCP로 다시 확인</title><desc>오류와 Web Vitals, 사용자 행동을 나눠 수집하고 서비스 안에서 다시 조회했습니다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8797"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif}text{font-variant-numeric:tabular-nums}</style>
  <rect width="1440" height="1090" fill="#f5f7fa"/>
  <rect x="22" y="22" width="1396" height="1046" rx="28" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/>
  <text x="76" y="85" font-size="40" font-weight="700" fill="#182230" text-anchor="start">수집한 정보를 MCP로 다시 확인</text>
  <text x="76" y="127" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">오류와 Web Vitals, 사용자 행동을 나눠 수집하고 서비스 안에서 다시 조회했습니다</text>
  <rect x="80" y="190" width="360" height="170" rx="20" fill="#edf4ff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="235" font-size="28" font-weight="700" fill="#182230" text-anchor="start">오류와 로그</text><text x="108" y="279" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">API와 브라우저</text><text x="108" y="316" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">개발용 확인 이벤트</text><rect x="520" y="190" width="360" height="170" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="548" y="235" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Sentry</text><text x="548" y="279" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">service, layer, release</text><text x="548" y="316" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">수집 응답과 eventId</text><rect x="960" y="190" width="400" height="170" rx="20" fill="#fff2e6" stroke="#dce3eb" stroke-width="1.5"/><text x="988" y="235" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Sentry MCP</text><text x="988" y="279" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">eventId로 다시 조회</text><text x="988" y="316" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">발생 위치와 배포 버전 확인</text><path d="M449 277 L510 277" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M889 277 L950 277" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="420" width="360" height="170" rx="20" fill="#edf4ff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="465" font-size="28" font-weight="700" fill="#182230" text-anchor="start">브라우저 성능</text><text x="108" y="509" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">LCP, CLS, INP</text><text x="108" y="546" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">FCP, TTFB</text><rect x="520" y="420" width="360" height="170" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="548" y="465" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Sentry Web Vitals</text><text x="548" y="509" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">측정값과 성능 span</text><text x="548" y="546" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">브라우저 전송 테스트</text><rect x="960" y="420" width="400" height="170" rx="20" fill="#fff2e6" stroke="#dce3eb" stroke-width="1.5"/><text x="988" y="465" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Sentry MCP</text><text x="988" y="509" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">trace ID로 실제 수신 확인</text><text x="988" y="546" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">LCP, CLS, INP span 조회</text><path d="M449 507 L510 507" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M889 507 L950 507" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="650" width="360" height="170" rx="20" fill="#edf4ff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="695" font-size="28" font-weight="700" fill="#182230" text-anchor="start">사용자 행동</text><text x="108" y="739" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">페이지뷰와 성공 이벤트</text><text x="108" y="776" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">개발 프로젝트로 전송</text><rect x="520" y="650" width="360" height="170" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="548" y="695" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Amplitude</text><text x="548" y="739" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">화면과 client 구분</text><text x="548" y="776" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">페이지뷰 집계</text><rect x="960" y="650" width="400" height="170" rx="20" fill="#fff2e6" stroke="#dce3eb" stroke-width="1.5"/><text x="988" y="695" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Amplitude MCP</text><text x="988" y="739" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">프로젝트와 이벤트 조회</text><text x="988" y="776" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">개발 프로젝트의 집계 확인</text><path d="M449 737 L510 737" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M889 737 L950 737" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="875" width="1280" height="125" rx="15" fill="#f5f7fa" stroke="none" stroke-width="1.5"/><text x="108" y="920" font-size="26" font-weight="700" fill="#182230" text-anchor="start">검증한 범위</text><text x="108" y="964" font-size="24" font-weight="400" fill="#5e6b7c" text-anchor="start">개발용 이벤트와 테스트 상호작용으로 전송과 수신을 확인했습니다. 운영 사용자 성과와는 구분합니다.</text>
  <path d="M76 1023 H1364" stroke="#dce3eb"/>
  <text x="76" y="1053" font-size="18" font-weight="400" fill="#5e6b7c" text-anchor="start">김진건 | AI 활용 경험</text>
</svg>