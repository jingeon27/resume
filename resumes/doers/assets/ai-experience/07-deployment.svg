  <rect x="70" y="210" width="280" height="372" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="98" y="255" font-size="28" font-weight="700" fill="#182230" text-anchor="start">GitHub Actions</text><text x="98" y="299" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">테스트와 빌드</text><text x="98" y="336" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">검증한 이미지</text><text x="98" y="373" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">digest로 고정</text><text x="98" y="410" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">배포 전 DB 덤프</text><text x="98" y="447" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">실패 시 이전 이미지</text><path d="M360 404 L409 404" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="180" width="550" height="670" rx="22" fill="#f5f7fa" stroke="#dce3eb" stroke-width="1.5"/><text x="458" y="225" font-size="30" font-weight="700" fill="#182230" text-anchor="start">EC2 한 대</text><rect x="458" y="254" width="494" height="74" rx="13" fill="#edf4ff" stroke="none" stroke-width="1.5"/><text x="705" y="301" font-size="27" font-weight="600" fill="#182230" text-anchor="middle">Caddy 80 / 443</text><path d="M584 338 L584 361" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M826 338 L826 361" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="458" y="375" width="234" height="190" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="486" y="420" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Game Mate</text><text x="486" y="464" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">Next.js Web</text><text x="486" y="501" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">NestJS API</text><text x="486" y="538" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">전용 네트워크</text><rect x="718" y="375" width="234" height="190" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="746" y="420" font-size="28" font-weight="700" fill="#182230" text-anchor="start">사진 커뮤니티</text><text x="746" y="464" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">Next.js Web</text><text x="746" y="501" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">NestJS API</text><text x="746" y="538" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">전용 네트워크</text><path d="M575 575 L575 610" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M835 575 L835 610" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="458" y="620" width="494" height="190" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="486" y="665" font-size="28" font-weight="700" fill="#182230" text-anchor="start">PostgreSQL 컨테이너</text><text x="486" y="709" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">서비스별 DB와 계정 분리</text><text x="486" y="746" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">데이터는 별도 EBS 볼륨</text><text x="486" y="783" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">실행 계정과 migration 계정 분리</text><rect x="1060" y="210" width="310" height="235" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="1088" y="255" font-size="28" font-weight="700" fill="#182230" text-anchor="start">파일 S3</text><text x="1088" y="299" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">서비스별 버킷</text><text x="1088" y="336" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">서명된 업로드와 조회</text><text x="1088" y="373" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">서비스별 접근 권한</text><rect x="1060" y="510" width="310" height="300" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="1088" y="555" font-size="28" font-weight="700" fill="#182230" text-anchor="start">DB 백업</text><text x="1088" y="599" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">EBS 일일 스냅샷</text><text x="1088" y="636" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">배포 전 pg_dump</text><text x="1088" y="673" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">별도 S3 백업 버킷</text><text x="1088" y="710" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">덤프 실패 시 배포 중단</text><path d="M989 458 H1020 V327 H1051" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M989 715 H1051" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="890" width="1280" height="110" rx="15" fill="#fff2e6" stroke="none" stroke-width="1.5"/><text x="108" y="933" font-size="25" font-weight="700" fill="#ee7624" text-anchor="start">받아들인 비용</text><text x="337" y="933" font-size="26" font-weight="600" fill="#182230" text-anchor="start">EC2 장애 시 두 서비스와 DB가 함께 중단됩니다.</text><text x="337" y="970" font-size="21" font-weight="400" fill="#5e6b7c" text-anchor="start">초기 비용을 줄이는 대신 백업과 복구를 직접 관리합니다. 전체 AWS 적용과 부하 검증은 별도입니다.</text>
