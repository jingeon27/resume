<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="865" viewBox="0 0 1440 865" role="img" aria-label="DB 변경과 공개 캐시 갱신을 연결한 방식">
  <title>DB 변경과 공개 캐시 갱신을 연결한 방식</title><desc>Game Mate의 공개 게시글 캐시와 무효화 실패 복구</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8797"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif}text{font-variant-numeric:tabular-nums}</style>
  <rect width="1440" height="865" fill="#f5f7fa"/>
  <rect x="22" y="22" width="1396" height="821" rx="28" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/>
  <text x="76" y="85" font-size="40" font-weight="700" fill="#182230" text-anchor="start">DB 변경과 공개 캐시 갱신을 연결한 방식</text>
  <text x="76" y="127" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">Game Mate의 공개 게시글 캐시와 무효화 실패 복구</text>
  <rect x="80" y="190" width="820" height="150" rx="20" fill="#edf4ff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="235" font-size="28" font-weight="700" fill="#2563eb" text-anchor="start">NestJS에서 하나의 트랜잭션으로 저장</text><text x="108" y="279" font-size="25" font-weight="400" fill="#5e6b7c" text-anchor="start">제품 데이터 변경 + 무효화할 tag + revision</text><path d="M490 349 L490 377" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="515" y="371" font-size="22" font-weight="400" fill="#5e6b7c" text-anchor="start">커밋 후 전달</text><rect x="80" y="390" width="820" height="115" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="435" font-size="28" font-weight="700" fill="#182230" text-anchor="start">Next.js Route Handler</text><text x="108" y="479" font-size="25" font-weight="400" fill="#5e6b7c" text-anchor="start">허용된 태그와 요청을 확인해 캐시 만료 호출</text><path d="M490 514 L490 542" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="555" width="820" height="115" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="108" y="600" font-size="28" font-weight="700" fill="#182230" text-anchor="start">revalidateTag(tag, { expire: 0 })</text><text x="108" y="644" font-size="25" font-weight="400" fill="#5e6b7c" text-anchor="start">공개 서버 캐시를 만료하고 다음 조회에 새 데이터 사용</text><rect x="980" y="190" width="380" height="150" rx="20" fill="#ffffff" stroke="#dce3eb" stroke-width="1.5"/><text x="1008" y="235" font-size="28" font-weight="700" fill="#182230" text-anchor="start">DB의 대기 기록</text><text x="1008" y="279" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">tag별 최신 revision</text><text x="1008" y="316" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">커밋 실패 시 함께 롤백</text><path d="M909 264 L971 264" fill="none" stroke="#5e6b7c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="980" y="400" width="380" height="270" rx="20" fill="#fff2e6" stroke="#dce3eb" stroke-width="1.5"/><text x="1008" y="445" font-size="28" font-weight="700" fill="#ee7624" text-anchor="start">콜백 전달이 실패하면</text><text x="1008" y="489" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">DB 기록을 남겨 둠</text><text x="1008" y="526" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">5초 후 다시 전달</text><text x="1008" y="563" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">앱 재시작 후에도 재시도</text><text x="1008" y="600" font-size="23" font-weight="400" fill="#5e6b7c" text-anchor="start">제품 쓰기는 성공으로 응답</text><path d="M909 448 H948 V512 H971" fill="none" stroke="#5e6b7c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="80" y="715" width="1280" height="63" rx="14" fill="#f5f7fa" stroke="none" stroke-width="1.5"/><text x="110" y="756" font-size="24" font-weight="400" fill="#182230" text-anchor="start">성공 응답을 받은 tag와 revision만 지워, 늦게 끝난 이전 요청이 새 기록을 지우지 않게 했습니다.</text>
  <path d="M76 798 H1364" stroke="#dce3eb"/>
  <text x="76" y="828" font-size="18" font-weight="400" fill="#5e6b7c" text-anchor="start">김진건 | AI 활용 경험</text>
</svg>