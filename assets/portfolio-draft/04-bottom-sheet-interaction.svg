<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870">
<title>반응형 Bottom Sheet의 상태와 검증 기준</title><desc>개인 프로젝트: 같은 입력 폼을 유지한 채 시트와 모달로 전환</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8494a7"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}</style>
<rect width="1440" height="870" fill="#fff"/>
<text x="72" y="78" font-size="40" font-weight="700" fill="#172b4d">반응형 Bottom Sheet의 상태와 검증 기준</text><text x="72" y="124" font-size="24" font-weight="400" fill="#52647a">개인 프로젝트: 같은 입력 폼을 유지한 채 시트와 모달로 전환</text>
<rect x="80" y="190" width="520" height="210" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="106" y="235" font-size="29" font-weight="700" fill="#172b4d">모바일 시트</text><text x="106" y="283" font-size="24" font-weight="400" fill="#52647a">하단에서 열고 닫기</text><text x="106" y="319" font-size="24" font-weight="400" fill="#52647a">키보드로 시트 높이 조절</text><rect x="840" y="190" width="520" height="210" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="866" y="235" font-size="29" font-weight="700" fill="#172b4d">데스크톱 모달</text><text x="866" y="283" font-size="24" font-weight="400" fill="#52647a">중앙에서 열고 닫기</text><text x="866" y="319" font-size="24" font-weight="400" fill="#52647a">같은 입력 폼과 포커스 유지</text><path d="M616 294 H824 V294" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="636" y="259" font-size="23" font-weight="400" fill="#172b4d">화면 크기 전환</text><rect x="80" y="470" width="1280" height="190" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="106" y="515" font-size="29" font-weight="700" fill="#172b4d">같은 Root와 Popup에서 유지하는 상태</text><text x="106" y="563" font-size="24" font-weight="400" fill="#52647a">작성 중인 입력, 열림과 닫힘, snap point</text><text x="106" y="599" font-size="24" font-weight="400" fill="#52647a">높이를 바꿔도 입력 보존, 닫으면 연 버튼으로 포커스 복귀</text><text x="80" y="739" font-size="25" font-weight="400" fill="#172b4d">키보드 높이 조절과 Escape 닫힘, 입력 보존과 포커스 복귀를 테스트에 명세했습니다.</text>
<path d="M72 804 H1368" stroke="#dbe4f0"/>
<text x="72" y="839" font-size="19" font-weight="400" fill="#52647a">김진건 | 포트폴리오 | 설명용 구성도</text>
</svg>