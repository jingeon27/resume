<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
<title>지원자 데이터 수집의 공통 단계와 사이트별 차이</title><desc>왓타임: Electron 수집 앱의 초기 구조 설계와 잡플래닛, 게임잡 연동</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8494a7"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}</style>
<rect width="1440" height="760" fill="#fff"/>
<text x="72" y="78" font-size="40" font-weight="700" fill="#172b4d">지원자 데이터 수집의 공통 단계와 사이트별 차이</text><text x="72" y="124" font-size="24" font-weight="400" fill="#52647a">왓타임: Electron 수집 앱의 초기 구조 설계와 잡플래닛, 게임잡 연동</text>
<rect x="80" y="190" width="280" height="155" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="106" y="235" font-size="29" font-weight="700" fill="#172b4d">로그인</text><rect x="414" y="190" width="280" height="155" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="440" y="235" font-size="29" font-weight="700" fill="#172b4d">수집</text><rect x="748" y="190" width="280" height="155" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="774" y="235" font-size="29" font-weight="700" fill="#172b4d">중복 확인</text><rect x="1082" y="190" width="280" height="155" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="1108" y="235" font-size="29" font-weight="700" fill="#172b4d">업로드</text><path d="M370 267 H404 V267" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M704 267 H738 V267" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1038 267 H1072 V267" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="405" width="600" height="195" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="106" y="450" font-size="29" font-weight="700" fill="#172b4d">공통 실행 단계</text><text x="106" y="498" font-size="24" font-weight="400" fill="#52647a">단계의 순서와 실행을 공통화</text><text x="106" y="534" font-size="24" font-weight="400" fill="#52647a">모듈 경계와 생성자 주입 참고</text><rect x="760" y="405" width="600" height="195" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="786" y="450" font-size="29" font-weight="700" fill="#172b4d">사이트별 adapter</text><text x="786" y="498" font-size="24" font-weight="400" fill="#52647a">잡플래닛과 게임잡 연동</text><text x="786" y="534" font-size="24" font-weight="400" fill="#52647a">사이트별 화면과 수집 방식 분리</text><text x="80" y="656" font-size="25" font-weight="400" fill="#172b4d">NestJS는 CTO 피드백으로 제거하고, 공통 단계와 adapter로 나눈 구조는 유지했습니다.</text>
<path d="M72 694 H1368" stroke="#dbe4f0"/>
<text x="72" y="729" font-size="19" font-weight="400" fill="#52647a">김진건 | 포트폴리오 | 설명용 구성도</text>
</svg>