<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
<title>프론트엔드 구조를 나눈 기준</title><desc>세이프닥: 코드의 위치와 값의 책임을 구분하고 lint와 타입 검사로 유지</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8494a7"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}</style>
<rect width="1440" height="940" fill="#fff"/>
<text x="72" y="78" font-size="40" font-weight="700" fill="#172b4d">프론트엔드 구조를 나눈 기준</text><text x="72" y="124" font-size="24" font-weight="400" fill="#52647a">세이프닥: 코드의 위치와 값의 책임을 구분하고 lint와 타입 검사로 유지</text>
<rect x="80" y="185" width="400" height="220" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="106" y="230" font-size="29" font-weight="700" fill="#172b4d">pages</text><text x="106" y="278" font-size="24" font-weight="400" fill="#52647a">화면 조합</text><text x="106" y="314" font-size="24" font-weight="400" fill="#52647a">페이지별 배치와 이동</text><rect x="520" y="185" width="400" height="220" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="546" y="230" font-size="29" font-weight="700" fill="#172b4d">features</text><text x="546" y="278" font-size="24" font-weight="400" fill="#52647a">서버 도메인</text><text x="546" y="314" font-size="24" font-weight="400" fill="#52647a">계약과 조회, 갱신</text><rect x="960" y="185" width="400" height="220" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="986" y="230" font-size="29" font-weight="700" fill="#172b4d">shared</text><text x="986" y="278" font-size="24" font-weight="400" fill="#52647a">도메인과 무관한 UI</text><text x="986" y="314" font-size="24" font-weight="400" fill="#52647a">공통 필드와 기반 코드</text><path d="M486 288 H510 V288" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M926 288 H950 V288" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="80" y="475" font-size="29" font-weight="700" fill="#172b4d">폼과 서버 상태는 값의 출처에 따라 분리</text><rect x="80" y="515" width="400" height="220" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="106" y="560" font-size="29" font-weight="700" fill="#172b4d">TanStack Query</text><text x="106" y="608" font-size="24" font-weight="400" fill="#52647a">서버 목록</text><text x="106" y="644" font-size="24" font-weight="400" fill="#52647a">조회와 캐시</text><rect x="520" y="515" width="400" height="220" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="546" y="560" font-size="29" font-weight="700" fill="#172b4d">React Hook Form</text><text x="546" y="608" font-size="24" font-weight="400" fill="#52647a">작성 중인 입력</text><text x="546" y="644" font-size="24" font-weight="400" fill="#52647a">선택과 수정</text><rect x="960" y="515" width="400" height="220" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="986" y="560" font-size="29" font-weight="700" fill="#172b4d">Zod</text><text x="986" y="608" font-size="24" font-weight="400" fill="#52647a">제출 조건</text><text x="986" y="644" font-size="24" font-weight="400" fill="#52647a">URL과 요청의 공통 계약</text><text x="80" y="808" font-size="26" font-weight="400" fill="#172b4d">화면 간 직접 참조와 순환 의존성을 정리하고, 필드 경로와 값은 타입으로 검사합니다.</text>
<path d="M72 874 H1368" stroke="#dbe4f0"/>
<text x="72" y="909" font-size="19" font-weight="400" fill="#52647a">김진건 | 포트폴리오 | 설명용 구성도</text>
</svg>