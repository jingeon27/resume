<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
<title>AI 구현과 사람의 검토를 연결한 순서</title><desc>세이프닥 실무 workflow: 에이전트가 완성본을 제출하면 검토하고 반려와 수정을 반복</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8494a7"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}</style>
<rect width="1440" height="940" fill="#fff"/>
<text x="72" y="78" font-size="40" font-weight="700" fill="#172b4d">AI 구현과 사람의 검토를 연결한 순서</text><text x="72" y="124" font-size="24" font-weight="400" fill="#52647a">세이프닥 실무 workflow: 에이전트가 완성본을 제출하면 검토하고 반려와 수정을 반복</text>
<rect x="80" y="190" width="400" height="190" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="106" y="235" font-size="29" font-weight="700" fill="#172b4d">티켓과 plan 검토</text><text x="106" y="283" font-size="24" font-weight="400" fill="#52647a">요구사항과 빠진 동작</text><text x="106" y="319" font-size="24" font-weight="400" fill="#52647a">검증 조건 확인</text><rect x="520" y="190" width="400" height="190" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="546" y="235" font-size="29" font-weight="700" fill="#172b4d">테스트 작성</text><text x="546" y="283" font-size="24" font-weight="400" fill="#52647a">새 기능의 기대 동작</text><text x="546" y="319" font-size="24" font-weight="400" fill="#52647a">운영과 QA 오류 재현</text><rect x="960" y="190" width="400" height="190" rx="20" fill="#eef4ff" stroke="#dbe4f0"/><text x="986" y="235" font-size="29" font-weight="700" fill="#172b4d">에이전트 구현과 리뷰</text><text x="986" y="283" font-size="24" font-weight="400" fill="#52647a">제품 코드와 테스트</text><text x="986" y="319" font-size="24" font-weight="400" fill="#52647a">완성본 제출</text><path d="M486 278 H510 V278" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M926 278 H950 V278" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1160 390 V430 H280 V465" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="480" width="400" height="190" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="106" y="525" font-size="29" font-weight="700" fill="#172b4d">변경분 검사</text><text x="106" y="573" font-size="24" font-weight="400" fill="#52647a">테스트, lint, typecheck</text><text x="106" y="609" font-size="24" font-weight="400" fill="#52647a">요구 조건과 결과 비교</text><rect x="520" y="480" width="400" height="190" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="546" y="525" font-size="29" font-weight="700" fill="#172b4d">직접 리뷰와 화면 확인</text><text x="546" y="573" font-size="24" font-weight="400" fill="#52647a">제품 코드와 테스트 읽기</text><text x="546" y="609" font-size="24" font-weight="400" fill="#52647a">입력과 실패 동작 확인</text><rect x="960" y="480" width="400" height="190" rx="20" fill="#f4f6f8" stroke="#dbe4f0"/><text x="986" y="525" font-size="29" font-weight="700" fill="#172b4d">전체 CI와 QA 요청</text><text x="986" y="573" font-size="24" font-weight="400" fill="#52647a">테스트, knip, lint</text><text x="986" y="609" font-size="24" font-weight="400" fill="#52647a">마지막 QA 더블 체크</text><path d="M486 568 H510 V568" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M926 568 H950 V568" stroke="#8494a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="80" y="755" font-size="26" font-weight="400" fill="#172b4d">새 테스트 패턴은 제품 코드를 일부러 깨뜨려 실제로 실패하는지 확인합니다.</text><text x="80" y="802" font-size="25" font-weight="400" fill="#172b4d">반복되는 기준은 skills와 lint rule에 남깁니다. QA 요청은 실무에서 수행합니다.</text>
<path d="M72 874 H1368" stroke="#dbe4f0"/>
<text x="72" y="909" font-size="19" font-weight="400" fill="#52647a">김진건 | 포트폴리오 | 설명용 구성도</text>
